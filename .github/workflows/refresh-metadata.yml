name: Refresh public App Store data
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3,15 * * *'
permissions:
  contents: write
concurrency:
  group: duoatlas-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public Apple feeds and metadata
        run: python scripts/refresh_metadata.py
      - name: Commit updated public metadata (if changed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/apps.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public App Store metadata'
            git push
          fi
