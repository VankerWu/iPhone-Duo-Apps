name: "推荐收录 App"
description: "提供需要追踪的 App 及公开适配证据"
title: "[收录] App 名称"
labels: ["app-request"]
body:
  - type: input
    id: name
    attributes:
      label: App 名称
    validations:
      required: true
  - type: input
    id: appstore
    attributes:
      label: App Store 链接
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 适配证据（如有）
      description: "开发者公告、更新说明、实机报告链接；没有证据也可以申请加入待确认名单。"
